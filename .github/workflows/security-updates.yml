name: Security Updates

# Nightly patch updates for the dependencies and plugins this project owns (everything
# outside izgw-bom / izgw-core / v2tofhir, which are bumped by their own release process).
# The work is done by the shared workflow in IZGateway/izg-dependency-scripts; see its
# README section "maven-security-updates".
#
# The bot's PR is built, deployed to dev and integration-tested by maven.yml like any other
# PR. PRs from the NIGHTLY schedule (or a manual run with auto_merge) are approved and merged
# by the auto-merge-security-update job in maven.yml once that build passes. Other manual
# runs open a PR for human review.
#
# Scope is controlled by:
#   - automation-exclusions.txt   artifacts never bumped (upstream IZG projects, FIPS jars)
#   - versions-rules.xml          pre-release / flavour filters
#   - pom.xml versions-maven-plugin config (allowMinorUpdates=false => patch releases only)

on:
  schedule:
    # Mon-Fri 08:00 UTC: after izgw-bom's nightly update (07:00 UTC) and the
    # develop build (06:00 UTC), so upstream changes land first.
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Auto-merge the PR like a nightly run (use to test the auto-merge path)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  actions: write        # re-run the PR build if it is cancelled in the dev queue
  pull-requests: read

concurrency:
  group: security-updates
  cancel-in-progress: false

jobs:
  security-updates:
    uses: IZGateway/izg-dependency-scripts/.github/workflows/maven-security-updates.yml@IGDD-2766
    with:
      auto-merge: ${{ github.event_name == 'schedule' || inputs.auto_merge == true }}
      maven-servers: github-bom github-core v2tofhir
      ci-description: the build, OWASP dependency-check, dev deploy and integration tests
    secrets:
      dependency-bot-app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
      dependency-bot-app-key: ${{ secrets.DEPENDENCY_BOT_APP_KEY }}
