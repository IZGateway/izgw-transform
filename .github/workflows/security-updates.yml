name: Security Updates

# Applies PATCH releases to the dependencies and plugins this project owns (everything
# outside izgw-bom / izgw-core / v2tofhir, which are bumped by their own release process),
# then opens a PR against develop.
#
# The PR is built, deployed to dev and integration-tested by maven.yml like any other PR.
# PRs from the NIGHTLY schedule are approved and merged automatically by the auto-merge
# job in maven.yml once that build passes. PRs from a MANUAL run are left for human review.
#
# Scope is controlled by:
#   - automation-exclusions.txt   artifacts never bumped (upstream IZG projects, FIPS jars)
#   - versions-rules.xml          pre-release / flavour filters
#   - pom.xml versions-maven-plugin config (allowMinorUpdates=false => patch releases only)

on:
  push:
    branches: [IGDD-2766]   # TEMP-TEST: revert before merge
  schedule:
    # Mon-Fri 08:00 UTC: after izgw-bom's nightly update (07:00 UTC) and the
    # develop build (06:00 UTC), so upstream changes land first.
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Auto-merge the PR like a nightly run (use to test the auto-merge path)"
        type: boolean
        default: false

# All writes (branch push, PR create, closing superseded PRs) use the izg-dependency-bot
# App token. GITHUB_TOKEN is only used read-only for Maven resolution from GitHub Packages.
# An App token is required because events raised by GITHUB_TOKEN do not trigger workflows,
# so a PR opened with it would never run maven.yml (build, deploy, integration tests).
permissions:
  contents: read
  packages: read

concurrency:
  group: security-updates
  cancel-in-progress: false

jobs:
  security-updates:
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: IGDD-2766   # TEMP-TEST: revert before merge (normally develop)
    steps:
      - name: Generate Dependency Bot App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_APP_KEY }}

      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}   # TEMP-TEST
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.9.0

      - name: Configure Maven authentication
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github-bom</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>github-core</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>v2tofhir</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Read automation exclusions
        run: |
          EXCLUDES=$(grep -v '^\s*#' automation-exclusions.txt | grep -v '^\s*$' | paste -sd ',' -)
          echo "EXCLUDES=$EXCLUDES" >> "$GITHUB_ENV"
          echo "Excluding from automation: $EXCLUDES"

      - name: Apply patch version updates
        run: |
          cp pom.xml pom.xml.before
          # Patch-only behaviour comes from the versions-maven-plugin configuration in pom.xml.
          # use-latest-versions: literal <version>s in dependencies / dependencyManagement.
          # update-properties:   ${*.version} properties defined in this pom (incl. plugins).
          mvn -B -ntp versions:use-latest-versions versions:update-properties \
            -Dexcludes="$EXCLUDES" \
            -DprocessDependencyManagementTransitive=false \
            2>&1 | tee apply-updates.log

          if git diff --quiet -- pom.xml; then
            echo "HAS_CHANGES=false" >> "$GITHUB_ENV"
            echo "No patch updates available."
          else
            echo "HAS_CHANGES=true" >> "$GITHUB_ENV"
            git diff -- pom.xml
          fi

      - name: Report no updates
        if: env.HAS_CHANGES == 'false'
        run: |
          {
            echo "## No patch updates available"
            echo ""
            echo "All project-owned dependencies and plugins are on their latest patch release."
          } >> "$GITHUB_STEP_SUMMARY"

      # Fail fast before opening a PR. The full build, OWASP dependency-check, dev deploy
      # and integration tests run on the PR itself in maven.yml.
      - name: Compile with updated versions
        if: env.HAS_CHANGES == 'true'
        run: mvn -B -ntp test-compile -DskipDependencyCheck=true

      - name: Build PR body
        if: env.HAS_CHANGES == 'true'
        run: |
          # Table of changed <x.version> properties: old -> new
          TABLE=$(diff pom.xml.before pom.xml | python3 -c '
          import re, sys
          old, new = {}, {}
          for line in sys.stdin:
              m = re.match(r"([<>])\s*<([\w.-]+)>([^<]+)</\2>", line)
              if m:
                  (old if m.group(1) == "<" else new)[m.group(2)] = m.group(3)
          for k in new:
              print("| `%s` | `%s` | `%s` |" % (k, old.get(k, "?"), new[k]))
          ')

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.auto_merge }}" = "true" ]; then
            MERGE_NOTE="**Auto-merge:** yes. This PR came from the nightly schedule (or a manual run with auto_merge=true), so it is approved and merged automatically once the \`Java CI with Maven\` build (build, dependency-check, dev deploy, integration tests) passes."
          else
            MERGE_NOTE="**Auto-merge:** no. This PR came from a manual run, so it needs a human review."
          fi

          {
            echo "## Automated patch updates"
            echo ""
            echo "Created by the [Security Updates workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo "Only **patch** releases of dependencies and plugins owned by this project are applied."
            echo ""
            echo "$MERGE_NOTE"
            echo ""
            echo "### Version changes"
            echo ""
            echo "| Property | Old | New |"
            echo "|----------|-----|-----|"
            echo "$TABLE"
            echo ""
            echo "### Not updated by this workflow"
            echo ""
            echo "Artifacts listed in \`automation-exclusions.txt\`:"
            echo ""
            grep -v '^\s*#' automation-exclusions.txt | grep -v '^\s*$' | sed 's/.*/- `&`/'
            echo ""
            echo "<details><summary>pom.xml diff</summary>"
            echo ""
            echo '```diff'
            git diff -- pom.xml
            echo '```'
            echo "</details>"
          } > pr-body.md
          cat pr-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request
        if: env.HAS_CHANGES == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # The branch prefix tells maven.yml's auto-merge job whether this PR may be
          # merged automatically: security-updates/nightly-* (yes) or security-updates/manual-* (no).
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.auto_merge }}" = "true" ]; then KIND=nightly; else KIND=manual; fi
          BRANCH="security-updates/${KIND}-$(date -u +'%Y%m%d-%H%M')"

          git config user.name "izg-dependency-bot[bot]"
          # 321530222 is the bot USER id (gh api '/users/izg-dependency-bot[bot]'), not the App id.
          git config user.email "321530222+izg-dependency-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pom.xml
          git commit -m "chore(deps): apply patch dependency updates $(date -u +'%Y-%m-%d')"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "chore(deps): security patch updates $(date -u +'%Y-%m-%d')" \
            --body-file pr-body.md \
            --label dependencies)
          echo "PR created: $PR_URL"
          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"

          # Close earlier open security-update PRs; this one supersedes them.
          gh pr list --state open --base "$BASE_BRANCH"--json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"security-updates/\")) | select(.headRefName != \"$BRANCH\") | .number" \
          | while read -r OLD; do
              echo "Closing superseded PR #$OLD"
              gh pr close "$OLD" --delete-branch --comment "Superseded by $PR_URL"
            done

          {
            echo ""
            echo "## Pull request created"
            echo ""
            echo "$PR_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: security-updates-logs
          if-no-files-found: ignore
          path: |
            pom.xml
            pom.xml.before
            apply-updates.log
            pr-body.md
