name: Java CI with Maven

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - develop

  # Schedule runs on the default branch.
  schedule:
    - cron: '0 6 * * 1-5'

  workflow_dispatch:

# Ensure only one build changes dev environment at the same time
concurrency: dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the software
        uses: actions/checkout@v7
        with:
          ssh-key: ${{secrets.ACTIONS_KEY}}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.9.0

      - name: Set up Toolchain
        shell: bash
        run: |
          echo COMPUTERNAME=`hostname` >> $GITHUB_ENV
          npm install -g newman-reporter-junitfull
          npm install -g xunit-viewer
          mkdir -p ~/.m2
          cat << EOF > ~/.m2/settings.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>github-bom</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                  <id>github-core</id>
                  <username>${{ github.actor }}</username>
                  <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>v2tofhir</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
          cat << EOF > ~/.m2/toolchains.xml
          <?xml version="1.0" encoding="UTF8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
                <provides>
                  <version>11</version>
                  <vendor>sun</vendor>
                </provides>
                <configuration>
                  <jdkHome>$JAVA_HOME_11_X64</jdkHome>
                </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
                <provides>
                  <version>21</version>
                  <vendor>sun</vendor>
                </provides>
                <configuration>
                  <jdkHome>$JAVA_HOME_21_X64</jdkHome>
                </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Set BASE_TAG
        run: |
          echo BASE_TAG=`mvn help:evaluate -Dexpression=project.version -q -DforceStdout` >> $GITHUB_ENV

      - name: Check version format
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]]; then
            echo "Version $VERSION is not in the correct format. It should be #.#.# or #.#.#-SNAPSHOT"
            exit 1
          fi

      - name: Output target branch
        run: |
          echo "github.event.pull_request.base.ref: ${{ github.event.pull_request.base.ref }}"
          echo "github.ref: ${{ github.ref }}"
          echo "github.event_name: ${{ github.event_name }}"

      - name: Set VERSION from pom
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo VERSION="${VERSION}" >> $GITHUB_ENV

      - name: Set tags
        run: |
          IMAGE_TAG="${VERSION}-${{github.run_number}}"
          echo IMAGE_TAG="${IMAGE_TAG}"
          echo IMAGE_TAG="${IMAGE_TAG}" >> $GITHUB_ENV
          echo IMAGE_BRANCH_TAG="${VERSION}"
          echo IMAGE_BRANCH_TAG="${VERSION}" >> $GITHUB_ENV

      - name: Print all environment variables
        run: printenv

      - name: Sets check env vars
        run: |
          # default to force a revision check unless releasing
          echo DO_REVISION_CHECK=true >> $GITHUB_ENV
          # Skip dependency check
          echo SKIP_DEPENDENCY_CHECK=true >> $GITHUB_ENV


      - name: Maven Install
        env:
          COMMON_PASS: ${{ secrets.COMMON_PASS }}
          ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
          SSL_SHARE: ${{ github.workspace }}/target

        run: |
          env && mvn -B clean package install site -Dbuildno=${{github.run_number}} \
              -DdoRevisionCheck=${{env.DO_REVISION_CHECK}} \
              -DskipDependencyCheck=${{env.SKIP_DEPENDENCY_CHECK}} \
              -Dimage.tag=$IMAGE_BRANCH_TAG
                
#
# Use GitHub Action to speed up and improve dependency checking
# NOTE: Disable automatic dependency checking in the build, this replaces it
      - name: Dependency Check
        env:
        # Per https://github.com/marketplace/actions/dependency-check, fix JAVA_HOME location for action
          JAVA_HOME: /opt/jdk
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: false
        timeout-minutes: 15
        with:
          project: IZG Transformation Service
          path: target/xform-${{env.BASE_TAG}}.jar
          format: 'HTML'
          out: 'target/site'
          args: >
            --disableOssIndex
            --failOnCVSS 7
            --suppression ./dependency-suppression.xml
            --nvdApiKey ${{ secrets.NVDAPIKEY }}
            --disableNuspec
            --disableNugetconf
            --disableAssembly
            --disableCentral

      - name: Upload dependency check log
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: DependencyCheck
          path: ./target/site/dependency-check-report.html

      - name: Publish Site (Develop)
        # Publish to /develop/ for: push to develop, PRs targeting develop, scheduled runs, manual dispatch
        if: |
          github.ref == 'refs/heads/develop' ||
          (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop') || (github.event_name == 'schedule' && github.ref == 'refs/heads/develop')
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site
          destination_dir: develop

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: transformation-service
        run: |
          docker image tag izgw-transform:${{env.IMAGE_TAG}} $ECR_REGISTRY/$ECR_REPOSITORY:${{env.IMAGE_TAG}}
          docker image tag izgw-transform:${{env.IMAGE_TAG}} $ECR_REGISTRY/$ECR_REPOSITORY:${{env.IMAGE_BRANCH_TAG}}
          docker image tag izgw-transform:${{env.IMAGE_TAG}} $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker image tag izgw-transform:${{env.IMAGE_TAG}} ghcr.io/izgateway/izgw-transform:${{env.IMAGE_TAG}}
          docker image tag izgw-transform:${{env.IMAGE_TAG}} ghcr.io/izgateway/izgw-transform:${{env.IMAGE_BRANCH_TAG}}
          docker image tag izgw-transform:${{env.IMAGE_TAG}} ghcr.io/izgateway/izgw-transform:latest
          docker image push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY
          docker image push --all-tags ghcr.io/izgateway/izgw-transform

        # AWS_REGIONS can be set in GitHub Settings -> Secrets and variables -> Actions -> Variables -> Repository Variables
        # Format: space-separated regions (e.g., "us-east-1 us-west-2")
        # Default of us-east-1 will be used if this is not set
        # ECS_DESIRED_COUNT can be set in GitHub Settings -> Secrets and variables -> Actions -> Variables -> Repository Variables
        # This is used to know how many container instances to start. Default is 1 if not set
      - name: Update ECS service to force new deployment of latest image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: transformation-service
          AWS_REGIONS: ${{ vars.AWS_REGIONS }}
          ECS_DESIRED_COUNT: ${{ vars.ECS_DESIRED_COUNT }}
        run: |
          if [ -z "$AWS_REGIONS" ]; then
            echo "AWS_REGIONS not set, defaulting to us-east-1"
            AWS_REGIONS="us-east-1"
          fi
          
          if [ -z "$ECS_DESIRED_COUNT" ]; then
            echo "ECS_DESIRED_COUNT not set, defaulting to 1"
            ECS_DESIRED_COUNT="1"
          fi
          
          for region in $AWS_REGIONS; do
            echo "Update ECS services in $region (starting $ECS_DESIRED_COUNT containers)"
            aws ecs update-service --region $region --cluster xform-service-alb-dev --service xform-service-alb-dev --force-new-deployment --enable-execute-command --desired-count $ECS_DESIRED_COUNT | jq ".service.deployments[].id" &
          done
          
          wait
          
          for region in $AWS_REGIONS; do
            echo "Wait for ECS service stability in $region"
            aws ecs wait services-stable --region $region --cluster xform-service-alb-dev --service xform-service-alb-dev &
          done
          
          wait

      - name: Setup certs
        env:
          TESTING_CERT: ${{ secrets.TESTING_CERT }}
          TESTING_KEY: ${{ secrets.TESTING_KEY }}
        run: |
          echo "$TESTING_CERT" > testing/newman.pem
          # Don't upload this file !!!
          echo "$TESTING_KEY" > testing/newman.key
                                  
      - name: Execute Functional Tests
        id: FunctionalTests
        working-directory: ./testing/scripts
        env:
          TESTING_PASS: ${{ secrets.TESTING_PASS }}
          JWT_SHARED_SECRET: ${{ secrets.JWT_SHARED_SECRET }}
        run: |
          mkdir ../logs
          # Do a few warmup runs to let SLA testing pass
          newman run ../scripts/TS_Integration_Test.postman_collection.json -x -n 2 \
            --folder "Integration Tests" \
            "--environment" ../scripts/dev.xform.izgateway.org.postman_environment.json \
            "--env-var" "jwtSharedSecret=$JWT_SHARED_SECRET" \
            "--ssl-extra-ca-certs" ../certs/izgwroot.pem \
            "--ssl-client-cert" ../newman.pem \
            "--ssl-client-key" ../newman.key \
            "--ssl-client-passphrase" $TESTING_PASS \
            "--insecure"  > ../logs/warmup.log
            
          newman run ../scripts/TS_Integration_Test.postman_collection.json -n 1 \
            --folder "Certificate" \
            "--environment" ../scripts/dev.xform.izgateway.org.postman_environment.json \
            "--env-var" "jwtSharedSecret=$JWT_SHARED_SECRET" \
            "--ssl-extra-ca-certs" ../certs/izgwroot.pem \
            "--ssl-client-cert" ../newman.pem \
            "--ssl-client-key" ../newman.key \
            "--ssl-client-passphrase" $TESTING_PASS \
            "--insecure" --reporters cli,junitfull --reporter-junitfull-export ../logs/integration-test.xml

      - name: Upload test logs
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: TestLogs
          path: ./testing/logs
                                      
      - name: List .m2 directory on build failure
        if: ${{ failure() }}
        run: ls -laR ~/.m2 > m2-directory.txt
                               
      - name: Upload build environment as artifact for failed build
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: build-failure
          path: .                   

  # Auto-approve and merge PRs opened by the NIGHTLY Security Updates workflow
  # (.github/workflows/security-updates.yml) once the build job above has built the PR,
  # passed OWASP dependency-check, deployed to dev and passed the integration tests.
  # Manual-run PRs (security-updates/manual-*) and any other PR are never auto-merged.
  auto-merge-security-updates:
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'izg-dependency-bot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'security-updates/nightly-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Provenance check. Commit metadata (author, committer) is chosen by whoever creates
      # the commit, but the repository activity log records the authenticated actor that
      # actually created or updated the branch, and that cannot be faked. Every write to
      # this branch must have been made by izg-dependency-bot[bot], and the last write
      # must have produced exactly the head commit that was built and tested.
      # Fails closed: no activity, any other actor, or a head mismatch refuses the merge.
      - name: Verify only izg-dependency-bot wrote to the PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ACTIVITY=$(gh api -X GET "repos/$GH_REPO/activity" --paginate \
            -f ref="refs/heads/$HEAD_REF" -f direction=asc -f per_page=100 \
            --jq '.[] | "\(.actor.login // "unknown") \(.activity_type) \(.after)"')
          echo "Branch activity (actor type after):"
          echo "${ACTIVITY:-<none>}"
          if [ -z "$ACTIVITY" ]; then
            echo "::error::Auto-merge refused: no activity recorded for $HEAD_REF, so its provenance cannot be verified."
            exit 1
          fi
          ACTORS=$(printf '%s\n' "$ACTIVITY" | awk '{print $1}' | sort -u)
          if [ "$ACTORS" != "izg-dependency-bot[bot]" ]; then
            echo "::error::Auto-merge refused: $HEAD_REF was written by actor(s) other than izg-dependency-bot[bot]: $(echo $ACTORS)"
            exit 1
          fi
          if printf '%s\n' "$ACTIVITY" | awk '{print $2}' | grep -qx force_push; then
            echo "::error::Auto-merge refused: $HEAD_REF has been force-pushed."
            exit 1
          fi
          LAST_AFTER=$(printf '%s\n' "$ACTIVITY" | tail -1 | awk '{print $3}')
          if [ "$LAST_AFTER" != "$HEAD_SHA" ]; then
            echo "::error::Auto-merge refused: last recorded write to $HEAD_REF is $LAST_AFTER, not the tested head $HEAD_SHA."
            exit 1
          fi
          echo "Provenance OK: every write to $HEAD_REF was made by izg-dependency-bot[bot]."

      # Guard against anything other than the bot's own pom.xml bump, e.g. a human pushing
      # extra commits to the bot's branch. Author metadata alone can be faked with
      # `git commit --author=...`, so every commit must also carry a GitHub-verified
      # signature. security-updates.yml creates its commit through the Git Data API with the
      # App token, and GitHub signs commits made that way. GitHub records its own signing
      # account, web-flow, as the COMMITTER of such commits, never the bot, so the expected
      # identity is "izg-dependency-bot[bot] web-flow true". web-flow alone does not prove
      # who made the commit; the activity-log check above does.
      - name: Verify PR only contains bot-authored pom.xml changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' | sort -u)
          echo "Changed files: $FILES"
          if [ "$FILES" != "pom.xml" ]; then
            echo "::error::Auto-merge refused: PR changes files other than pom.xml."
            exit 1
          fi
          # One line per distinct "author committer verified" combination across all commits.
          IDENTITIES=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/commits" --paginate \
            --jq '.[] | "\(.author.login // "unknown") \(.committer.login // "unknown") \(.commit.verification.verified)"' \
            | sort -u)
          echo "Commit author / committer / verified: $IDENTITIES"
          if [ "$IDENTITIES" != "izg-dependency-bot[bot] web-flow true" ]; then
            echo "::error::Auto-merge refused: every commit must be authored by izg-dependency-bot[bot], committed and signed by GitHub (web-flow), and verified."
            exit 1
          fi

      # develop requires one approving review. The PR is authored by izg-dependency-bot,
      # so github-actions[bot] (GITHUB_TOKEN) can supply it. Requires the repo setting
      # "Allow GitHub Actions to create and approve pull requests".
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "$PR_NUMBER" --approve \
            --body "Auto-approved: nightly security patch update passed build, dependency-check, dev deploy and integration tests in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."

      # Merge with the App token, not GITHUB_TOKEN, so the push to develop triggers the
      # develop build. --match-head-commit ensures only the commit tested above is merged.
      - name: Generate Dependency Bot App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_APP_KEY }}

      - name: Merge PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "$PR_NUMBER" --merge --delete-branch --match-head-commit "$HEAD_SHA"
          echo "Merged PR #$PR_NUMBER into develop." >> "$GITHUB_STEP_SUMMARY"
